<style>

.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;padding:1rem;z-index:50}

.mc{background:#fff;border-radius:14px;padding:1.5rem;max-width:480px;width:100%;max-height:90vh;overflow-y:auto}

<script>

var SC=[['Instagram','#E4405F','https://instagram.com/biomajid'],['YouTube','#FF0000','https://youtube.com/@biomajid'],['Telegram','#0088CC','https://t.me/biomajid'],['WhatsApp','#25D366','https://wa.me/989120000000'],['Facebook','#1877F2','https://facebook.com/biomajid'],['LinkedIn','#0A66C2','https://linkedin.com/company/biomajid'],['TikTok','#000','https://tiktok.com/@biomajid'],['X','#000','https://x.com/biomajid'],['Aparat','#ED145B','https://aparat.com/biomajid'],['Rubika','#7C3AED','https://rubika.ir/biomajid'],['Bale','#0EA5E9','https://ble.ir/biomajid'],['Eitaa','#F97316','https://eitaa.com/biomajid']];
var S={lang:'fa',chat:[]};
function $(s){return document.querySelector(s)}
function nav(r){location.hash='#/'+r}
function closeM(id){$('#'+id).classList.remove('on')}
function openM(id){$('#'+id).classList.add('on')}
function L(k){return (T[S.lang]&&T[S.lang][k])||T.fa[k]||k}
function renderNav(){var items=['home','chat','exp','vid','guide','ai'];$('#nav').innerHTML=items.map(function(i){return '<a href="#/'+i+'">'+L(i)+'</a>'}).join('')}
function route(){var h=(location.hash||'#/home').replace('#/','');var M={home:vH,chat:vC,exp:vE,vid:vV,guide:vG,ai:vA};$('#app').innerHTML=(M[h]||vH)();renderNav();if(h==='chat')renderChat('#cpy');window.scrollTo(0,0)}
function vH(){return '<section class="hero"><h1>'+L('hero')+'</h1><p>'+L('sub')+'</p><a href="#/chat" class="btn bp">💬 '+L('s1')+'</a><a href="#/exp" class="btn be">👨‍⚕️ '+L('s2')+'</a></section><section><h2>'+L('svc')+'</h2><div class="g">'+SV.map(function(s){return '<div class="card"><i>'+s[0]+'</i><h3>'+s[1]+'</h3></div>'}).join('')+'</div></section>'}

function vV(){return '<section><h2>🎬 '+L('vidT')+'</h2><div class="g">'+[['🏥','آشنایی'],['💚','عادت سلامت'],['🧘','یوگا'],['🥗','تغذیه']].map(function(v){return '<div class="card"><div style="aspect-ratio:16/9;background:#0ea5e9;display:grid;place-items:center;font-size:2.5rem;border-radius:8px">'+v[0]+'</div><h3 style="margin-top:.5rem">'+v[1]+'</h3></div>'}).join('')+'</div></section>'}
function vG(){return '<section><h2>'+L('guide')+'</h2><div style="max-width:700px;margin:0 auto">'+[L('g1'),L('g2'),L('g3'),L('g4')].map(function(g,i){return '<div class="card" style="display:flex;gap:.7rem;margin-bottom:.7rem;align-items:center"><div style="width:30px;height:30px;background:#0ea5e9;color:#fff;border-radius:8px;display:grid;place-items:center;font-weight:bold">'+(i+1)+'</div><div>'+g+'</div></div>'}).join('')+'</div></section>'}
function vA(){return '<section><h2>🤖 AI Page</h2><div class="card"><pre style="white-space:pre-wrap;direction:ltr;text-align:left;font-size:.8rem;font-family:monospace"># BIOMAJID CLINIC\n# Endpoint: '+location.href.replace(/\/[^\/]*$/,'/')+'#/ai\n\n## SERVICES\n'+SV.map(function(s){return '- '+s[1]}).join('\n')+'\n\n## SPECIALTIES\n'+SP.map(function(s){return '- '+s[1]}).join('\n')+'\n\n## EXPERTS\n'+EX.map(function(e){return '- '+e[1]+' ('+e[2]+')'}).join('\n')+'\n\n## SOCIAL\n'+SC.map(function(s){return '- '+s[0]+': '+s[2]}).join('\n')+'\n\n## ROUTES\n#/home #/chat #/exp #/vid #/guide #/ai\n\n© '+new Date().getFullYear()+' Biomajid</pre></div></section>'}
function renderChat(sel){var c=$(sel);if(!c)return;c.innerHTML='';if(!S.chat.length)S.chat=[['b',L('wel')]];S.chat.forEach(function(m){var d=document.createElement('div');d.className='m '+m[0];d.textContent=m[1];c.appendChild(d)});c.scrollTop=c.scrollHeight}
function sendTo(sel,box){var inp=$(sel);if(!inp||!inp.value.trim())return;var txt=inp.value.trim();inp.value='';S.chat.push(['u',txt]);var c=$(box);var d=document.createElement('div');d.className='m u';d.textContent=txt;c.appendChild(d);c.scrollTop=c.scrollHeight;setTimeout(function(){var r='سلام. برای فعال‌سازی هوش مصنوعی، از پنل ادمین کلید API را وارد کنید. برای اتصال به کارشناس انسانی، روی دکمه 👨‍⚕️ بزنید.';S.chat.push(['b',r]);var d2=document.createElement('div');d2.className='m b';d2.textContent=r;c.appendChild(d2);c.scrollTop=c.scrollHeight},600)}

function setLang(k){S.lang=k;try{localStorage.setItem('bj_lang',k)}catch(e){}closeM('m2');route()}
function renderSC(){$('#sg').innerHTML=SC.map(function(s){return '<a href="'+s[2]+'" class="sb" style="background:'+s[1]+'" title="'+s[0]+'" target="_blank">'+s[0].charAt(0)+'</a>'}).join('')}
function init(){try{var l=localStorage.getItem('bj_lang');if(l)S.lang=l}catch(e){}renderSC();route();try{if(!localStorage.getItem('bj_consent')){setTimeout(function(){$('#ml1').innerHTML='<label><input type="checkbox"> پیامک</label><br><label><input type="checkbox"> واتس‌اپ</label><br><label><input type="checkbox"> ایمیل</label><br><label><input type="checkbox"> تماس</label>';openM('m1')},1000)}}catch(e){}}
$('#lg').onclick=openLang;
$('#fb').onclick=function(){var b=$('#cb');b.classList.toggle('on');if(b.classList.contains('on')){renderChat('#cy');setTimeout(function(){$('#ci').focus()},100)}};
